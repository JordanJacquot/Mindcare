# Vérifications automatiques à chaque envoi (push) et à chaque demande de fusion (pull request).
# Tout tourne dans Windows PowerShell 5.1, comme l'appli. Aucune fenêtre ne s'ouvre, rien ne va sur Internet (l'assistant
# n'est jamais téléchargé) et rien n'est installé ni modifié sur la machine.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Analyse du code (PSScriptAnalyzer, erreurs seulement)"
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            # (la galerie PowerShell répond parfois mal : jusqu'à 3 essais)
            for ($n = 1; $n -le 3; $n++) {
              try { Install-Module PSScriptAnalyzer -Repository PSGallery -Force -Scope CurrentUser; break }
              catch { if ($n -eq 3) { throw }; Start-Sleep -Seconds 15 }
            }
          }
          $erreurs = @(Invoke-ScriptAnalyzer -Path Mindcare -Recurse -Severity Error)
          $erreurs | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($erreurs.Count) { Write-Host "$($erreurs.Count) erreur(s) trouvée(s) par PSScriptAnalyzer."; exit 1 }
          Write-Host 'Aucune erreur.'

      - name: "Vérifications (syntaxe, encodage, fenêtre, tirets, licence)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\verifier.ps1
          exit $LASTEXITCODE

      - name: "Tests sans fenêtre (catalogue, enquêtes, recherche, images, garde-fou et arrêt de l'assistant)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester.ps1 -SansFenetre
          exit $LASTEXITCODE
