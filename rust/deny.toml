# cargo deny : licences, avis de sécurité, bibliothèques permises, origine des bibliothèques (réglages repris du Rust
# de Mindset).

[graph]
# La suite ne tourne que sous Windows
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Toute faille connue (base RustSec) ou version retirée fait échouer la vérification
ignore = []

[licenses]
# Licences compatibles avec la licence MIT de la suite
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# Nos propres crates (publish = false) : licence MIT, déclarée dans Cargo.toml
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Liste blanche : seules ces bibliothèques peuvent entrer (directes ou indirectes). En ajouter une se fait ici,
# après relecture.
allow = [
    # les nôtres
    "mindcare-moteur",
    "mindcare-windows",
    # Windows (Microsoft) : la lecture du journal, de WMI et des disques (mindcare-windows), comme le Rust de Mindset
    "windows",
    "windows-core",
    "windows-collections",
    "windows-future",
    "windows-numerics",
    "windows-threading",
    "windows-result",
    "windows-strings",
    "windows-implement",
    "windows-interface",
    "windows-link",
    # macros de windows (construction seulement)
    "proc-macro2",
    "quote",
    "syn",
    "unicode-ident",
    "mindcare-donnees",
    # la bibliothèque commune de la suite (dépôt Mindset, révision épinglée) : json_sur et les chemins comme .NET.
    # Elle apporte aussi ce dont ses autres parties ont besoin (signature, zips), relu dans le dépôt Mindset (mêmes
    # versions que son Cargo.lock).
    "suite-commun",
    # signature (ring) et sa construction
    "ring",
    "untrusted",
    "cc",
    "find-msvc-tools",
    "shlex",
    "cfg-if",
    "getrandom",
    "windows-sys",
    # zip (deflate seulement)
    "zip",
    "crc32fast",
    "flate2",
    "zlib-rs",
    "zopfli",
    "bumpalo",
    "log",
    "simd-adler32",
    "typed-path",
    # JSON (le catalogue, les données), avec l'ordre des champs du fichier (indexmap)
    "serde_json",
    "serde_core",
    "itoa",
    "memchr",
    "zmij",
    "indexmap",
    "equivalent",
    "hashbrown",
    "foldhash",
    # les accents de la recherche par mots (forme décomposée, comme .NET)
    "unicode-normalization",
    "tinyvec",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# La bibliothèque commune de la suite (suite-commun), épinglée par sa révision dans mindcare-donnees\Cargo.toml
allow-git = ["https://github.com/JordanJacquot/Mindset"]