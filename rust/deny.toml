# cargo deny : licences, avis de sécurité, bibliothèques permises, origine des bibliothèques (réglages repris du Rust
# de Mindset).

[graph]
# La suite ne tourne que sous Windows
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Toute faille connue (base RustSec) ou version retirée fait échouer la vérification
ignore = []

[licenses]
# Licences compatibles avec la licence MIT de la suite
# MPL-2.0 et BSD-3-Clause : décision de Jordan du 02/11/2026 (étape 4), pour les bibliothèques de Tauri : MPL-2.0
# pour la lecture des pages et de leur CSS (cssparser, selectors, dtoa-short) et option-ext (dirs), BSD-3-Clause
# pour la compression des pages rangées dans l'exe (brotli). Licences ouvertes, compatibles avec la licence MIT de la
# suite tant que leur code n'est pas modifié.
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSD-3-Clause"]
confidence-threshold = 0.9

[licenses.private]
# Nos propres crates (publish = false) : licence MIT, déclarée dans Cargo.toml
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Refusés en toutes circonstances (regles-tauri.md, règle 4, et plan de l'étape 4) : ni accès général au disque ni
# lancement de programmes par la page, pas de mise à jour ni de raccourcis par Tauri (Mindset s'en charge), et notre
# propre verrou (Local\Mindcare-Instance) plutôt que celui du plugin. La CI vérifie aussi que `cargo tree -i` ne les
# trouve pas.
deny = [
    { crate = "tauri-plugin-shell", reason = "règle 4 : jamais de lancement de programme par la page" },
    { crate = "tauri-plugin-fs", reason = "règle 4 : jamais d'accès général au disque par la page" },
    { crate = "tauri-plugin-updater", reason = "les mises à jour passent par Mindset" },
    { crate = "tauri-plugin-single-instance", reason = "notre propre verrou (contrat-appli, partie 3)" },
    { crate = "tauri-plugin-global-shortcut", reason = "aucun raccourci global" },
]
# Liste blanche : seules ces bibliothèques peuvent entrer (directes ou indirectes). En ajouter une se fait ici,
# après relecture.
allow = [
    # les nôtres
    "mindcare-moteur",
    "mindcare-windows",
    # Windows (Microsoft) : la lecture du journal, de WMI et des disques (mindcare-windows), comme le Rust de Mindset
    "windows",
    "windows-core",
    "windows-collections",
    "windows-future",
    "windows-numerics",
    "windows-threading",
    "windows-result",
    "windows-strings",
    "windows-implement",
    "windows-interface",
    "windows-link",
    # macros de windows (construction seulement)
    "proc-macro2",
    "quote",
    "syn",
    "unicode-ident",
    "mindcare-donnees",
    # la bibliothèque commune de la suite (dépôt Mindset, révision épinglée) : json_sur et les chemins comme .NET.
    # Prise sans ses options par défaut (mindcare-donnees\Cargo.toml) : ni signature (ring), ni zips (zip), ni heure
    # de Windows ; elle n'apporte que serde_json.
    "suite-commun",
    # JSON (le catalogue, les données), avec l'ordre des champs du fichier (indexmap)
    "serde_json",
    "serde_core",
    "itoa",
    "memchr",
    "zmij",
    "indexmap",
    "equivalent",
    "hashbrown",
    "foldhash",
    # les accents de la recherche par mots (forme décomposée, comme .NET)
    "unicode-normalization",
    "tinyvec",
    # Étape 4 (02/11/2026) : Tauri et ce qu'il tire sous Windows (cargo tree --target x86_64-pc-windows-msvc), relu
    # nom par nom. Les plugins de Tauri n'y sont pas : ils sont refusés plus bas.
    # les nôtres (étape 4)
    "mindcare-appli", "mindcare-vie",
    # le relais Mindcare.exe (étape 4.5) : seulement windows, déjà dans la liste
    "mindcare-relais",
    # les téléchargements de l'assistant et de la dictée (étape 6.1) : seulement sha2, flate2 (version Rust :
    # miniz_oxide, crc32fast) et windows (WinHTTP), tous déjà dans la liste
    "mindcare-telechargement",
    # la dictée (étape 6.3) : seulement suite-commun, mindcare-telechargement, regex (déjà tiré par Tauri) et
    # windows (waveIn, Job Object), tous déjà dans la liste
    "mindcare-dictee",
    # le moteur de l'assistant (étape 6.2) : seulement mindcare-moteur, mindcare-telechargement, serde_json, sha2 et
    # windows (Job Object, BCryptGenRandom), tous déjà dans la liste
    "mindcare-assistant",
    # Tauri 2.12.5, figé dans mindcare-appli\Cargo.toml (tauri-build est tiré par tauri lui-même pour sa construction)
    "tauri", "tauri-build", "tauri-codegen", "tauri-macros", "tauri-runtime", "tauri-runtime-wry", "tauri-utils",
    "tauri-winres",
    # la fenêtre et la page : wry, tao, WebView2 de Microsoft, menus (muda), ce que Windows demande
    "wry", "tao", "webview2-com", "webview2-com-macros", "webview2-com-sys", "muda", "window-vibrancy", "softbuffer",
    "dpi", "raw-window-handle", "keyboard-types", "windows-sys", "windows-version",
    # construction de l'exe : ressources Windows (icône, informations de version), runtime C lié dans l'exe, lecture de Cargo.toml
    "embed-resource", "static_vcruntime", "vswhom", "vswhom-sys", "winreg", "cc", "find-msvc-tools", "shlex",
    "cargo_metadata", "cargo_toml", "cargo-platform", "camino", "semver", "rustc_version", "autocfg", "version_check",
    # images de l'icône et compression des pages rangées dans l'exe (option « compression »)
    "ico", "png", "fdeflate", "simd-adler32", "crc32fast", "miniz_oxide", "adler2", "flate2", "brotli",
    "brotli-decompressor", "alloc-no-stdlib", "alloc-stdlib",
    # lecture des pages à la construction (CSP, empreintes des scripts) : HTML et CSS
    "html5ever", "markup5ever", "dom_query", "tendril", "string_cache", "string_cache_codegen", "web_atoms",
    "precomputed-hash", "new_debug_unreachable", "utf_types", "cssparser", "cssparser-macros", "selectors",
    "servo_arc", "dtoa", "dtoa-short", "phf", "phf_codegen", "phf_generator", "phf_macros", "phf_shared", "siphasher",
    "fastrand", "bit-set", "bit-vec", "smallvec", "rustc-hash", "derive_more", "derive_more-impl",
    # configuration et échanges avec la page (serde, JSON, TOML)
    "serde", "serde_derive", "serde_derive_internals", "serde_repr", "serde-untagged", "erased-serde", "typeid",
    "serde_with", "serde_with_macros", "serde_spanned", "schemars", "schemars_derive", "dyn-clone", "json-patch",
    "jsonptr", "serialize-to-javascript", "serialize-to-javascript-impl", "toml", "toml_datetime", "toml_parser",
    "toml_writer", "winnow", "plist", "quick-xml", "time", "time-core", "time-macros", "deranged", "powerfmt",
    "num-conv", "darling", "darling_core", "darling_macro", "ident_case", "strsim", "fnv",
    # adresses (url) et noms internationaux (icu, de l'Unicode Consortium)
    "url", "urlpattern", "idna", "idna_adapter", "form_urlencoded", "percent-encoding", "utf8_iter",
    "icu_collections", "icu_locale_core", "icu_normalizer", "icu_normalizer_data", "icu_properties",
    "icu_properties_data", "icu_provider", "litemap", "potential_utf", "tinystr", "writeable", "yoke", "yoke-derive",
    "zerofrom", "zerofrom-derive", "zerotrie", "zerovec", "zerovec-derive", "displaydoc", "synstructure",
    "stable_deref_trait", "regex", "regex-automata", "regex-syntax", "aho-corasick",
    # protocoles de la page (http), types de fichiers, empreintes (sha2), identifiants
    "http", "bytes", "mime", "cookie", "base64", "infer", "cfb", "uuid", "sha2", "digest", "block-buffer",
    "crypto-common", "generic-array", "typenum", "cpufeatures", "getrandom",
    # fils, attentes et utilitaires de base (bitflags : drapeaux de tao et muda)
    "bitflags",
    "tokio", "pin-project-lite", "parking_lot", "parking_lot_core", "lock_api", "scopeguard", "once_cell",
    "crossbeam-channel", "crossbeam-utils", "cfg-if", "libc", "log", "tracing", "tracing-core", "anyhow", "thiserror",
    "thiserror-impl", "ctor", "dirs", "dirs-sys", "option-ext", "dunce", "glob", "walkdir", "same-file",
    "winapi-util", "heck", "unicode-segmentation", "byteorder", "web-time",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# La bibliothèque commune de la suite (suite-commun), épinglée par sa révision dans le Cargo.toml de l'espace de
# travail ([workspace.dependencies])
allow-git = ["https://github.com/JordanJacquot/Mindset"]