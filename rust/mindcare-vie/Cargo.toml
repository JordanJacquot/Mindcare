[package]
name = "mindcare-vie"
version = "0.1.0"
description = "La vie de Mindcare avec Mindset (portage de Mindcare.ps1, modules/mindset.ps1, systeme.ps1 et evenements.ps1) : démarrage, verrou, demandes, accrochage, thème, carte. Sans Tauri et sans Windows : ils sont derrière des traits"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Le dossier des données, suite.json (dossier.rs), la carte de Mindset et son écriture (carte.rs), le journal
mindcare-donnees = { path = "../mindcare-donnees" }
# La comparaison sans tenir compte des majuscules, comme PowerShell
mindcare-moteur = { path = "../mindcare-moteur" }
# Les chemins comme .NET (Join-Path, Split-Path) : la même révision relue que mindcare-donnees, sans ses options
suite-commun = { git = "https://github.com/JordanJacquot/Mindset", rev = "c187f50d6687f557ac0a048b2f0c8fa0b6a72371", default-features = false }

[lints]
workspace = true
