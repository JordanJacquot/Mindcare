# Le Rust de Mindcare (plan « Mindcare en Rust », 30/10/2026). Rien ici n'est livré aux utilisateurs pour l'instant :
# Mindcare publiée reste celle en PowerShell. Réglages repris du Rust de Mindset (D:\Projets\Mindset\rust).
[workspace]
resolver = "3"
members = ["mindcare-moteur", "mindcare-windows", "mindcare-donnees", "mindcare-appli", "mindcare-vie", "mindcare-relais", "mindcare-telechargement", "mindcare-dictee", "mindcare-assistant"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# La bibliothèque commune de la suite (dépôt Mindset), épinglée à une révision relue (jamais une copie du code), la
# même pour toutes les crates : json_sur et les chemins comme .NET (étape 3), le dossier WebView2 des applis Tauri et
# la lecture des fichiers de pack (étape 4, révision 0aad77c). Sans ses options par défaut : ni la signature (ring),
# ni les zips (zip), ni l'heure de Windows ; elle n'apporte que serde_json.
[workspace.dependencies]
suite-commun = { git = "https://github.com/JordanJacquot/Mindset", rev = "0aad77c0fd1cd92983775bec64646e1486cc857e", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Les tests optimisés : les juges rejouent des dizaines de milliers d'enquêtes et de recherches (sans cela, plus
# d'une minute)
[profile.test]
opt-level = 2
