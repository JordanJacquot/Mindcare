# Construction d'une version de Mindcare sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature
# Authenticode gratuite par SignPath Foundation (même modèle que Mindset et Nevermind, issue #4 de Mindset).
#
# Déroulé :
#   1. « construire » : compile Mindset.exe (le programme) et Mindcare.exe (son relais), construit catalogue.zip
#      (outils\construire.ps1), dépose le dossier Mindcare comme artefact à signer, et catalogue.zip (données pour Mindcare Mobile, jamais signées) à part.
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose Mindcare.zip (signé) comme artefact.
#   3. Sur le PC de Jordan : outils\publier.ps1 récupère ce Mindcare.zip, fait sa signature RSA (Mindcare.zip.sig,
#      clé privée qui ne quitte jamais le PC) et crée la Release avec catalogue.zip. Ce workflow ne publie rien.
#
# L'assistant (llama.cpp et le modèle) n'est jamais dans le zip : Mindcare le télécharge à la demande de l'utilisateur.
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  construire:
    name: "Construire Mindcare"
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Numéro de version"
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = [IO.File]::ReadAllText('Mindcare\fichiers\Mindcare.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans Mindcare.ps1' }
          $v = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version de Mindcare.ps1 ($v)."
          }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version4=$v4`n")
          Write-Host "Version $v ($v4)"

      # Mindset.exe et Mindcare.exe ne sont jamais pris dans le dépôt (.gitignore) : compilés ici depuis outils\lanceur.cs
      # (Mindset.exe, le programme : même nom pour toute la suite, une seule ligne « Mindset » dans le Gestionnaire des
      # tâches) et outils\relais.cs (Mindcare.exe, qui lance Mindset.exe : pour ce qui appelle encore Mindcare.exe)
      - name: "Construire (outils\\construire.ps1)"
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($e in 'Mindset.exe', 'Mindcare.exe') { if (Test-Path -LiteralPath "Mindcare\$e") { throw "$e ne doit pas venir du dépôt." } }
          .\outils\construire.ps1

      - name: "Vérifier Mindset.exe et Mindcare.exe"
        run: |
          $ErrorActionPreference = 'Stop'
          # (Where-Object et pas -Include : avec -LiteralPath, PowerShell 5.1 ignore -Include et rend tous les fichiers)
          $exes = @(Get-ChildItem -LiteralPath 'Mindcare' -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          $noms = @($exes | ForEach-Object { $_.FullName.Substring((Resolve-Path 'Mindcare').Path.Length + 1) } | Sort-Object)
          if (($noms -join ',') -ne 'Mindcare.exe,Mindset.exe') { throw "Seuls Mindset.exe et Mindcare.exe sont attendus à la racine du dossier, trouvés : $($noms -join ', ')" }
          foreach ($x in $exes) {
            $i = $x.VersionInfo
            Write-Host "$($x.Name) : produit $($i.ProductName), description $($i.FileDescription), version du produit $($i.ProductVersion), version du fichier $($i.FileVersion)"
            if ($i.ProductName -ne 'Mindcare') { throw "Nom de produit inattendu pour $($x.Name) : $($i.ProductName)" }
            if ($x.Name -eq 'Mindset.exe' -and $i.FileDescription -ne 'Mindset') { throw "Description inattendue pour Mindset.exe : $($i.FileDescription) (le nom de la ligne commune de la suite dans le Gestionnaire des tâches)" }
            if ($i.ProductVersion -ne '${{ steps.version.outputs.version4 }}') {
              Write-Host "::warning::La version de $($x.Name) ($($i.ProductVersion)) n'est pas ${{ steps.version.outputs.version4 }} : lanceur.cs ou relais.cs n'a pas été mis à jour par publier.ps1."
            }
            $h = (Get-FileHash -LiteralPath $x.FullName -Algorithm SHA256).Hash
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($x.Name) (non signé) : SHA-256 ``$h``" + "`n")
          }
          $c = (Get-FileHash -LiteralPath 'release\catalogue.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "catalogue.zip (données, jamais signé) : SHA-256 ``$c``" + "`n")

      - name: "Préparer le dossier à signer"
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath 'Mindcare' -Destination $dest -Recurse
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « Mindcare » (Mindset.exe, Mindcare.exe, LISEZMOI.txt, fichiers\...).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@v7
        with:
          name: Mindcare-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

      # Le catalogue pour Mindcare Mobile (enquetes.json et les dessins) : des données, jamais envoyées à SignPath
      - name: "Déposer catalogue.zip"
        uses: actions/upload-artifact@v7
        with:
          name: Mindcare-catalogue
          path: release/catalogue.zip
          if-no-files-found: error
          retention-days: 30

  signer:
    name: "Signer avec SignPath"
    needs: construire
    if: ${{ vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      # Sans artifact-configuration-slug, SignPath prend la configuration d'artefact par défaut du projet.
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Mindcare' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\Mindcare'
          foreach ($e in 'Mindset.exe', 'Mindcare.exe') { if (-not (Test-Path -LiteralPath "$racine\$e")) { throw "Dossier signé inattendu : $racine\$e absent" } }
          $problemes = @()
          # (Where-Object et pas -Include : avec -LiteralPath, PowerShell 5.1 ignore -Include et rend tous les fichiers)
          $nos = @(Get-Item -LiteralPath "$racine\Mindset.exe", "$racine\Mindcare.exe") + @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Aucun autre programme dans le dossier (l'assistant n'y est jamais : il est téléchargé à part, sur demande)
          $autres = @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' -and $_.FullName -notin $nos.FullName })
          foreach ($f in $autres) { $problemes += "Programme inattendu : $($f.FullName)" }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation."

      - name: "Construire Mindcare.zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
          $zip = '_ci\sortie\Mindcare.zip'
          Compress-Archive -Path '_ci\signe\Mindcare' -DestinationPath $zip -Force
          $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$h  Mindcare.zip" | Out-File -FilePath '_ci\sortie\Mindcare.zip.sha256' -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Mindcare.zip (signé par SignPath) : SHA-256 ``$h``" + "`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release)
      - name: "Déposer Mindcare.zip signé"
        uses: actions/upload-artifact@v7
        with:
          name: Mindcare-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
