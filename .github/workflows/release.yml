# Construction d'une version de Mindcare sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature
# Authenticode gratuite par SignPath Foundation (même modèle que Mindset et Nevermind, issue #4 de Mindset).
#
# Deux sortes de versions (« genre ») :
#   - PowerShell (Mindcare.ps1, la version publiée pour tout le monde) : tag v<version de Mindcare.ps1>, ou lancement à
#     la main avec genre = powershell (par défaut) ;
#   - Rust (Mindcare en Rust ; d'abord en version d'essai : préversion GitHub, que Mindset ne prend qu'avec la case
#     « Recevoir les versions d'essai ») : tag v<version du Cargo.toml de rust\mindcare-appli>, ou lancement à la main
#     avec genre = rust (c'est ce que fait outils\publier.ps1 -Rust avant de publier).
#
# Déroulé :
#   0. « rust » : seulement pour une version en Rust (sinon ce job ne fait rien). Rust 1.99.1 (rust-toolchain.toml),
#      règles Tauri de la suite (verifier-tauri.ps1 du dépôt Mindset, épinglé), cargo deny, construction de publication
#      (outils\construire-rust.ps1 : cargo build --release --locked, jamais l'option « essai »), puis Mindcare.zip au
#      même format que les autres zips de la suite (outils\zip-rust.ps1, vérifié par outils\verifier-zip-rust.ps1 :
#      exactement Mindset.exe, Mindcare.exe, MindcareAide.exe, version.json, LISEZMOI.txt et enquetes.json dans « Mindcare », fiches de
#      version, aucune trace de la construction d'essai, aucun runtime C à part). Le zip est attesté (attestation
#      GitHub : ce dépôt, ce fichier de construction, ce commit) et déposé comme artefact « Mindcare-rust ».
#      outils\publier.ps1 -Rust le récupère et vérifie son attestation avant de le signer :
#        gh attestation verify Mindcare.zip --repo JordanJacquot/Mindcare
#          --signer-workflow JordanJacquot/Mindcare/.github/workflows/release.yml --source-digest <commit publié>
#   1. « construire » : version PowerShell : compile Mindset.exe (le programme) et Mindcare.exe (son relais) et
#      construit catalogue.zip (outils\construire.ps1) ; version Rust : seulement catalogue.zip (outils\construire.ps1
#      -CatalogueSeul), et le dossier à signer est celui du zip en Rust. Dépose le dossier Mindcare comme artefact à
#      signer, et catalogue.zip (données pour Mindcare Mobile, jamais signées) à part.
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose Mindcare.zip (signé) comme artefact.
#   3. Sur le PC de Jordan : outils\publier.ps1 fait la signature RSA du zip (Mindcare.zip.sig, clé privée qui ne quitte
#      jamais le PC) et crée la Release avec catalogue.zip. Version PowerShell : le zip construit sur le PC ; version
#      Rust : le zip attesté du job « rust ». Ce workflow ne publie rien.
#
# L'assistant (llama.cpp et le modèle) n'est jamais dans le zip : Mindcare le télécharge à la demande de l'utilisateur.
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      genre:
        description: "Quelle Mindcare construire : powershell (la version publiée) ou rust (Mindcare en Rust)"
        type: choice
        options:
          - powershell
          - rust
        default: powershell

permissions:
  contents: read
  actions: read

jobs:
  rust:
    name: "Mindcare en Rust (seulement pour une version en Rust)"
    runs-on: windows-latest
    # (le jeton OIDC et l'écriture d'attestations : seulement pour ce job)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      CARGO_TERM_COLOR: never
      GENRE_DEMANDE: ${{ inputs.genre }}
    outputs:
      present: ${{ steps.rust.outputs.present }}
      version: ${{ steps.rust.outputs.version }}
    steps:
      # Les fichiers tels qu'ils sont dans git : sans ça, git pour Windows change les fins de ligne en CRLF, et
      # l'enquetes.json du zip n'est plus celui du commit (verifier-zip-rust.ps1 le refuse, publication du 04/11)
      - name: "Garder les fins de ligne de git"
        run: git config --global core.autocrlf false

      - name: "Récupérer le dépôt"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Une version en Rust : le tag est v<version du Cargo.toml de mindcare-appli>, ou le lancement à la main demande
      # « rust ». Un tag de la version PowerShell (v<version de Mindcare.ps1>) ne construit rien ici.
      - name: "Une version en Rust ? (tag v<version du Cargo.toml de rust/mindcare-appli>, ou genre = rust)"
        id: rust
        run: |
          $ErrorActionPreference = 'Stop'
          $present = $false; $version = ''
          $cargo = 'rust\mindcare-appli\Cargo.toml'
          if (Test-Path -LiteralPath $cargo) {
            $section = ''
            foreach ($l in [IO.File]::ReadAllLines((Resolve-Path -LiteralPath $cargo).Path, [Text.Encoding]::UTF8)) {
              $l = $l.Trim()
              if ($l.StartsWith('[')) { $section = $l; continue }
              if ($section -eq '[package]' -and $l -match '^version\s*=\s*"(\d+(\.\d+){1,3})"') { $version = $Matches[1]; break }
            }
            if (-not $version) { throw "Version de mindcare-appli introuvable ou mal écrite dans $cargo" }
            if ($env:GITHUB_REF_TYPE -eq 'tag') { $present = ($env:GITHUB_REF_NAME -ceq "v$version") }
            else { $present = ($env:GENRE_DEMANDE -eq 'rust') }
          } elseif ($env:GENRE_DEMANDE -eq 'rust') { throw "Mindcare en Rust demandée, mais $cargo n'existe pas." }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "present=$($present.ToString().ToLower())`nversion=$version`n")
          Write-Host "Mindcare en Rust : $present (version du Cargo.toml : $version)"

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml"
        if: ${{ steps.rust.outputs.present == 'true' }}
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Récupérer les règles Tauri et le contrôle des imports (dépôt Mindset, commit épinglé : outils\\verifier-tauri.ps1, outils\\verifier-imports.ps1)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          # (le même commit que dans tests.yml)
          ref: 619f307d25fb2a6408aeb383453129fc0e228c42
          path: _mindset
          persist-credentials: false

      - name: "Règles Tauri de la suite (verifier-tauri.ps1 sur rust\\mindcare-appli)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        working-directory: rust
        run: |
          & ..\_mindset\outils\verifier-tauri.ps1 -Projet mindcare-appli
          exit $LASTEXITCODE

      - name: "cargo deny : licences compatibles MIT, failles connues, liste blanche des bibliothèques (Tauri compris), plugins interdits"
        if: ${{ steps.rust.outputs.present == 'true' }}
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cargo-deny 0.20.2 tout prêt, vérifié par son empreinte (la même que dans tests.yml et dans Mindset)
          $d = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          $archive = Join-Path $d 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $h = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($h -ne '975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC') { Write-Host "Empreinte inattendue : $h"; exit 1 }
          tar -xzf $archive -C $d
          $exe = Get-ChildItem -LiteralPath $d -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --locked check
          if ($LASTEXITCODE) { exit 1 }

      # Construction de publication : cargo build --release --locked -p mindcare-appli -p mindcare-relais, sans l'option
      # « essai » (outils\construire-rust.ps1, le même que dans tests.yml)
      - name: "Construire Mindcare en Rust (outils\\construire-rust.ps1 : Mindset.exe, Mindcare.exe, version.json, LISEZMOI.txt, enquetes.json)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          & .\outils\construire-rust.ps1 -Sortie '_ci\rust'
          if (-not $?) { exit 1 }

      - name: "Mindcare.zip (outils\\zip-rust.ps1) et ses contrôles : fichiers exacts, version.json, fiches de version, aucune construction d'essai, aucun runtime C à part"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          & .\outils\zip-rust.ps1 -Dossier '_ci\rust\Mindcare' -Zip '_ci\rust-zip\Mindcare.zip' -VerifierImports '_mindset\outils\verifier-imports.ps1'
          if ($LASTEXITCODE) { exit 1 }
          $h = (Get-FileHash -LiteralPath '_ci\rust-zip\Mindcare.zip' -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Mindcare.zip (Rust ${{ steps.rust.outputs.version }}, non signé, commit $env:GITHUB_SHA) : SHA-256 ``$h``" + "`n")
          foreach ($e in 'Mindset.exe', 'Mindcare.exe', 'MindcareAide.exe') {
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$e (Rust) : SHA-256 ``$((Get-FileHash -LiteralPath "_ci\rust\Mindcare\$e" -Algorithm SHA256).Hash)``" + "`n")
          }

      # L'attestation que outils\publier.ps1 -Rust vérifie (gh attestation verify --repo JordanJacquot/Mindcare
      # --signer-workflow JordanJacquot/Mindcare/.github/workflows/release.yml --source-digest <commit>)
      - name: "Attester Mindcare.zip (ce dépôt, ce fichier de construction, ce commit)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/rust-zip/Mindcare.zip

      - name: "Déposer Mindcare.zip (Rust)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mindcare-rust
          path: _ci/rust-zip/
          if-no-files-found: error
          retention-days: 30

  construire:
    name: "Construire Mindcare"
    needs: rust
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      genre: ${{ steps.version.outputs.genre }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Le genre de la version : Rust si le job « rust » a construit Mindcare en Rust (son tag, ou genre = rust), sinon
      # PowerShell (un tag doit alors être v<version de Mindcare.ps1>)
      - name: "Numéro de version et genre (PowerShell ou Rust)"
        id: version
        env:
          RUST_PRESENT: ${{ needs.rust.outputs.present }}
          RUST_VERSION: ${{ needs.rust.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = [IO.File]::ReadAllText('Mindcare\fichiers\Mindcare.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans Mindcare.ps1' }
          $vps = $Matches[1]
          if ($env:RUST_PRESENT -eq 'true') { $genre = 'rust'; $v = $env:RUST_VERSION }
          else {
            $genre = 'powershell'; $v = $vps
            if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
              throw "Le tag $env:GITHUB_REF_NAME ne correspond ni à la version de Mindcare.ps1 ($v) ni à celle de Mindcare en Rust (Cargo.toml de rust\mindcare-appli)."
            }
          }
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Numéro de version illisible : « $v »" }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version4=$v4`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "genre=$genre`n")
          Write-Host "Version $v ($v4), $genre"

      # Mindset.exe et Mindcare.exe ne sont jamais pris dans le dépôt (.gitignore) : compilés ici depuis outils\lanceur.cs
      # (Mindset.exe, le programme : même nom pour toute la suite, une seule ligne « Mindset » dans le Gestionnaire des
      # tâches) et outils\relais.cs (Mindcare.exe, qui lance Mindset.exe : pour ce qui appelle encore Mindcare.exe).
      # Version Rust : seulement catalogue.zip (les deux exe viennent du job « rust »).
      - name: "Construire (outils\\construire.ps1 ; version Rust : seulement catalogue.zip)"
        env:
          GENRE: ${{ steps.version.outputs.genre }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($e in 'Mindset.exe', 'Mindcare.exe') { if (Test-Path -LiteralPath "Mindcare\$e") { throw "$e ne doit pas venir du dépôt." } }
          if ($env:GENRE -eq 'rust') { .\outils\construire.ps1 -CatalogueSeul }
          else { .\outils\construire.ps1 }

      - name: "Vérifier Mindset.exe et Mindcare.exe (version PowerShell)"
        if: ${{ steps.version.outputs.genre == 'powershell' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # (Where-Object et pas -Include : avec -LiteralPath, PowerShell 5.1 ignore -Include et rend tous les fichiers)
          $exes = @(Get-ChildItem -LiteralPath 'Mindcare' -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          $noms = @($exes | ForEach-Object { $_.FullName.Substring((Resolve-Path 'Mindcare').Path.Length + 1) } | Sort-Object)
          if (($noms -join ',') -ne 'Mindcare.exe,Mindset.exe') { throw "Seuls Mindset.exe et Mindcare.exe sont attendus à la racine du dossier, trouvés : $($noms -join ', ')" }
          foreach ($x in $exes) {
            $i = $x.VersionInfo
            Write-Host "$($x.Name) : produit $($i.ProductName), description $($i.FileDescription), version du produit $($i.ProductVersion), version du fichier $($i.FileVersion)"
            if ($i.ProductName -ne 'Mindcare') { throw "Nom de produit inattendu pour $($x.Name) : $($i.ProductName)" }
            if ($x.Name -eq 'Mindset.exe' -and $i.FileDescription -ne 'Mindset') { throw "Description inattendue pour Mindset.exe : $($i.FileDescription) (le nom de la ligne commune de la suite dans le Gestionnaire des tâches)" }
            if ($i.ProductVersion -ne '${{ steps.version.outputs.version4 }}') {
              Write-Host "::warning::La version de $($x.Name) ($($i.ProductVersion)) n'est pas ${{ steps.version.outputs.version4 }} : lanceur.cs ou relais.cs n'a pas été mis à jour par publier.ps1."
            }
            $h = (Get-FileHash -LiteralPath $x.FullName -Algorithm SHA256).Hash
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($x.Name) (non signé) : SHA-256 ``$h``" + "`n")
          }

      - name: "Empreinte de catalogue.zip"
        run: |
          $c = (Get-FileHash -LiteralPath 'release\catalogue.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "catalogue.zip (données, jamais signé) : SHA-256 ``$c``" + "`n")

      - name: "Récupérer Mindcare.zip en Rust (job rust de ce run)"
        if: ${{ steps.version.outputs.genre == 'rust' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mindcare-rust
          path: _ci/rust-zip

      # Version PowerShell : le dossier Mindcare du dépôt (avec les deux exe construits ici) ; version Rust : le dossier
      # Mindcare du zip en Rust, tel quel
      - name: "Préparer le dossier à signer"
        env:
          GENRE: ${{ steps.version.outputs.genre }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if ($env:GENRE -eq 'rust') { Expand-Archive -LiteralPath '_ci\rust-zip\Mindcare.zip' -DestinationPath $dest }
          else { Copy-Item -LiteralPath 'Mindcare' -Destination $dest -Recurse }
          if (-not (Test-Path -LiteralPath "$dest\Mindcare\Mindcare.exe")) { throw "Dossier à signer inattendu : $dest\Mindcare\Mindcare.exe absent" }
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « Mindcare » (Mindset.exe, Mindcare.exe, LISEZMOI.txt, et fichiers\... pour la
      # version PowerShell, ou version.json et enquetes.json pour la version Rust).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mindcare-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

      # Le catalogue pour Mindcare Mobile (enquetes.json et les dessins) : des données, jamais envoyées à SignPath
      - name: "Déposer catalogue.zip"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mindcare-catalogue
          path: release/catalogue.zip
          if-no-files-found: error
          retention-days: 30

  signer:
    name: "Signer avec SignPath"
    needs: construire
    if: ${{ vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      # Sans artifact-configuration-slug, SignPath prend la configuration d'artefact par défaut du projet.
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Mindcare' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\Mindcare'
          foreach ($e in 'Mindset.exe', 'Mindcare.exe') { if (-not (Test-Path -LiteralPath "$racine\$e")) { throw "Dossier signé inattendu : $racine\$e absent" } }
          $problemes = @()
          # (Where-Object et pas -Include : avec -LiteralPath, PowerShell 5.1 ignore -Include et rend tous les fichiers)
          # (MindcareAide.exe, l'Aide de Mindcare : seulement dans la version Rust, signée comme les deux autres)
          $aide = @(Get-Item -LiteralPath "$racine\MindcareAide.exe" -ErrorAction SilentlyContinue)
          $nos = @(Get-Item -LiteralPath "$racine\Mindset.exe", "$racine\Mindcare.exe") + $aide + @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Aucun autre programme dans le dossier (l'assistant n'y est jamais : il est téléchargé à part, sur demande)
          $autres = @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' -and $_.FullName -notin $nos.FullName })
          foreach ($f in $autres) { $problemes += "Programme inattendu : $($f.FullName)" }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation."

      - name: "Construire Mindcare.zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
          $zip = '_ci\sortie\Mindcare.zip'
          Compress-Archive -Path '_ci\signe\Mindcare' -DestinationPath $zip -Force
          $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$h  Mindcare.zip" | Out-File -FilePath '_ci\sortie\Mindcare.zip.sha256' -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Mindcare.zip (${{ needs.construire.outputs.genre }}, signé par SignPath) : SHA-256 ``$h``" + "`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release), le jour où SignPath sera actif
      - name: "Déposer Mindcare.zip signé"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mindcare-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
