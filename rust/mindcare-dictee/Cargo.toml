[package]
name = "mindcare-dictee"
version = "0.1.0"
description = "La dictée de Mindcare (portage de modules\\dictee.ps1 et de MindcareMicro, natif.cs) : le micro choisi dans Mindset, l'enregistrement, whisper-cli lancé sans fenêtre, le son effacé dès que la phrase est écrite"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Le faux whisper-cli des tests (comme celui compilé par outils\tester-dictee.ps1) : il note ses arguments et écrit la
# phrase demandée. Jamais livré : seuls les tests de cette crate s'en servent (CARGO_BIN_EXE_faux-whisper).
[[bin]]
name = "faux-whisper"
path = "src/bin/faux_whisper.rs"
test = false
doc = false

[dependencies]
# Versions figées (« = ») : une nouvelle version n'entre que par un changement relu. Aucune bibliothèque nouvelle :
# toutes sont déjà dans Cargo.lock et dans la liste blanche de deny.toml.
# Le micro choisi dans Mindset (suite.json), lu et retrouvé comme en PowerShell (Get-DicteeMicro)
suite-commun = { workspace = true }
# Les fichiers de la dictée et ce qui est installé (Test-DicteeInstallee)
mindcare-telechargement = { path = "../mindcare-telechargement" }
# ConvertFrom-Dictee : les mêmes expressions que le PowerShell (\w et \s au sens Unicode, comme .NET)
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }

# Le seul module qui parle à Windows (src\windows.rs) : le micro (waveIn, comme MindcareMicro), le Job Object qui
# arrête whisper avec Mindcare (ArreterAvecMindcare), et un processus encore vivant (fichiers de voix orphelins). La
# même version que le reste de la suite : rien de nouveau dans Cargo.lock.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

# Pas `workspace = true` : le module Windows (src\windows.rs) a besoin d'autoriser le code « unsafe », que le reste du
# dépôt interdit tout à fait (forbid). Ici, il est refusé partout (deny), sauf dans src\windows.rs.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
