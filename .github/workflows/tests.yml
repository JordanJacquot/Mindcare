# Vérifications automatiques à chaque envoi (push) et à chaque demande de fusion (pull request).
# Tout tourne dans Windows PowerShell 5.1, comme l'appli. Aucune fenêtre ne s'ouvre, rien ne va sur Internet (l'assistant
# n'est jamais téléchargé) et rien n'est installé ni modifié sur la machine.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Analyse du code (PSScriptAnalyzer, erreurs seulement)"
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            # (la galerie PowerShell répond parfois mal : jusqu'à 3 essais)
            for ($n = 1; $n -le 3; $n++) {
              try { Install-Module PSScriptAnalyzer -Repository PSGallery -Force -Scope CurrentUser; break }
              catch { if ($n -eq 3) { throw }; Start-Sleep -Seconds 15 }
            }
          }
          $erreurs = @(Invoke-ScriptAnalyzer -Path Mindcare -Recurse -Severity Error)
          $erreurs | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($erreurs.Count) { Write-Host "$($erreurs.Count) erreur(s) trouvée(s) par PSScriptAnalyzer."; exit 1 }
          Write-Host 'Aucune erreur.'

      - name: "Vérifications (syntaxe, encodage, fenêtre, tirets, licence)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\verifier.ps1
          exit $LASTEXITCODE

      - name: "Tests sans fenêtre (catalogue, enquêtes, recherche, images, garde-fou et arrêt de l'assistant)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester.ps1 -SansFenetre
          exit $LASTEXITCODE

      - name: "Tests du diagnostic (journaux de Windows lus sans figer la fenêtre, textes, carte de Mindset, journal et rapport)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-diagnostic.ps1
          exit $LASTEXITCODE

      - name: "Tests de l'assistant (lancé seulement quand on s'en sert, échecs montrés, disque plein ou fichier bloqué, installation coupée)"
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File outils\tester-assistant.ps1
          exit $LASTEXITCODE

  # Mindcare en Rust (étape 3 du passage en Rust) : rien de livré aux utilisateurs, seulement construit et vérifié.
  # Le moteur doit répondre exactement comme le moteur PowerShell (juges exportés par outils\exporter-juges.ps1).
  rust:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml (avec clippy et rustfmt)"
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Tests Rust : le moteur rejoue tous les juges (cargo test)"
        run: cargo test --locked --workspace

      - name: "Construction du programme de Mindcare en Rust (Tauri, versions du Cargo.lock)"
        run: cargo build --locked -p mindcare-appli

      - name: "Aucun plugin de Tauri interdit (shell, fs, updater, single-instance, global-shortcut)"
        run: |
          # (le shell powershell de GitHub arrête tout à la première erreur : cargo écrit ses messages sur stderr)
          $ErrorActionPreference = 'Continue'
          $interdits = 'tauri-plugin-shell', 'tauri-plugin-fs', 'tauri-plugin-updater', 'tauri-plugin-single-instance', 'tauri-plugin-global-shortcut'
          $lock = [IO.File]::ReadAllText((Join-Path (Get-Location) 'Cargo.lock'))
          $trouves = @()
          foreach ($p in $interdits) {
            # 1. le Cargo.lock (toutes les plateformes)
            if ($lock -match ('(?m)^name = "' + [regex]::Escape($p) + '"\r?$')) { $trouves += "$p (Cargo.lock)" }
            # 2. cargo tree -i : la bibliothèque ne doit être tirée par rien, sur aucune plateforme
            $sortie = (cmd /c "cargo tree --locked -i $p --target all -e all 2>&1") | Out-String
            if ($LASTEXITCODE -eq 0) { $trouves += "$p (cargo tree)" }
            elseif ($sortie -notmatch 'did not match any packages') { Write-Host $sortie; Write-Host "cargo tree n'a pas pu répondre pour $p."; exit 1 }
          }
          if ($trouves.Count) { Write-Host "Plugins interdits trouvés : $($trouves -join ', ')"; exit 1 }
          Write-Host 'Aucun plugin interdit.'
          # (sinon GitHub reprend le code de sortie du dernier cargo tree, qui échoue justement quand rien n'est trouvé)
          exit 0

      - name: "Récupérer les règles Tauri de la suite (dépôt Mindset, commit épinglé : outils\\verifier-tauri.ps1, outils\\verifier-imports.ps1)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          ref: 5a21aaa86d5070e6899b8e2ace652d43c6896d34
          path: _mindset
          persist-credentials: false

      - name: "Règles Tauri de la suite (verifier-tauri.ps1 sur rust\\mindcare-appli : configuration, capabilities, CSP, plugins, outils de développement, WebView2)"
        run: |
          & ..\_mindset\outils\verifier-tauri.ps1 -Projet mindcare-appli
          exit $LASTEXITCODE

      - name: "Construction de publication et dossier de Mindcare en Rust (outils\\construire-rust.ps1 : Mindset.exe, Mindcare.exe, version.json, LISEZMOI.txt)"
        run: |
          & ..\outils\construire-rust.ps1 -Sortie (Join-Path $env:RUNNER_TEMP 'mindcare-rust')
          if (-not $?) { exit 1 }

      - name: "Le dossier construit : fiches de version (Mindset pour l'hôte, Mindcare pour le relais), aucun runtime C à part (VCRUNTIME*, MSVCP*), version.json"
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'mindcare-rust\Mindcare'
          $problemes = @()
          # La version : celle du Cargo.toml de mindcare-appli, la seule source
          $section = ''; $version = $null
          foreach ($l in [IO.File]::ReadAllLines((Join-Path (Get-Location) 'mindcare-appli\Cargo.toml'))) {
            $l = $l.Trim()
            if ($l.StartsWith('[')) { $section = $l; continue }
            if ($section -eq '[package]' -and $l -match '^version\s*=\s*"([^"]*)"') { $version = $Matches[1]; break }
          }
          Write-Host "Version de Mindcare (Cargo.toml) : $version"
          # Les fiches de version : la description est ce qu'affiche le Gestionnaire des tâches (contrat-appli, partie 4)
          foreach ($e in @(@('Mindset.exe', 'Mindset'), @('Mindcare.exe', 'Mindcare'))) {
            $f = Join-Path $d $e[0]
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { $problemes += "$($e[0]) manque"; continue }
            $v = (Get-Item -LiteralPath $f).VersionInfo
            Write-Host "$($e[0]) : description « $($v.FileDescription) », produit « $($v.ProductName) », version $($v.ProductVersion)"
            if ($v.FileDescription -cne $e[1]) { $problemes += "$($e[0]) : description « $($v.FileDescription) » au lieu de « $($e[1]) »" }
            if ($v.ProductName -cne $e[1]) { $problemes += "$($e[0]) : produit « $($v.ProductName) » au lieu de « $($e[1]) »" }
            $p = @(([string]$v.ProductVersion).Split('.')); $a = @($version.Split('.'))
            while ($p.Count -lt 4) { $p += '0' }; while ($a.Count -lt 4) { $a += '0' }
            if (($p -join '.') -ne ($a -join '.')) { $problemes += "$($e[0]) : version $($v.ProductVersion) au lieu de $version" }
          }
          # Aucun runtime C à installer à part (le contrôle de Mindset, lu dans la table des imports, sans rien lancer)
          & ..\_mindset\outils\verifier-imports.ps1 -Fichiers (Join-Path $d 'Mindset.exe'), (Join-Path $d 'Mindcare.exe') -Liste
          if ($LASTEXITCODE) { $problemes += 'un programme a besoin d''un runtime C à part' }
          # version.json : lu comme Mindset le lit (un objet JSON, UTF-8 sans marque)
          $o = [IO.File]::ReadAllBytes((Join-Path $d 'version.json'))
          if ($o.Length -ge 3 -and $o[0] -eq 0xEF -and $o[1] -eq 0xBB -and $o[2] -eq 0xBF) { $problemes += 'version.json a une marque UTF-8 (BOM)' }
          $j = [Text.Encoding]::UTF8.GetString($o).TrimStart([char]0xFEFF) | ConvertFrom-Json
          Write-Host "version.json : appli $($j.appli), version $($j.version), mindset_min $($j.mindset_min)"
          if ($j.appli -cne 'mindcare') { $problemes += "version.json : appli « $($j.appli) »" }
          if ($j.version -cne $version) { $problemes += "version.json : version $($j.version) au lieu de $version" }
          if ($j.mindset_min -cne '2.15.0') { $problemes += "version.json : mindset_min $($j.mindset_min) au lieu de 2.15.0" }
          if (-not (Test-Path -LiteralPath (Join-Path $d 'LISEZMOI.txt') -PathType Leaf)) { $problemes += 'LISEZMOI.txt manque' }
          if ($problemes.Count) { $problemes | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'Dossier de Mindcare en Rust conforme.'

      - name: "L'exe livré ne connaît pas la construction d'essai (MINDCARE_DONNEES, capture : seulement avec l'option cargo essai)"
        run: |
          & ..\outils\verifier-sans-essai.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'mindcare-rust\Mindcare\Mindset.exe')
          exit $LASTEXITCODE

      - name: "Tests de la construction d'essai (cargo test --features essai)"
        run: cargo test --locked -p mindcare-appli --features essai

      - name: "Clippy strict (aucun avertissement permis)"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: "Clippy strict sur la construction d'essai (option cargo essai de mindcare-appli)"
        run: cargo clippy --locked -p mindcare-appli --all-targets --features essai -- -D warnings

      - name: "Mise en forme (cargo fmt)"
        run: cargo fmt --all --check

      - name: "cargo deny : licences compatibles MIT, failles connues, liste blanche des bibliothèques (Tauri compris), plugins interdits"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cargo-deny 0.20.2 tout prêt, vérifié par son empreinte (la même que dans Mindset), seulement sur la machine GitHub
          $d = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          $archive = Join-Path $d 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $h = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($h -ne '975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC') { Write-Host "Empreinte inattendue : $h"; exit 1 }
          tar -xzf $archive -C $d
          $exe = Get-ChildItem -LiteralPath $d -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --locked check
          if ($LASTEXITCODE) { exit 1 }
