# cargo deny : licences, avis de sécurité, bibliothèques permises, origine des bibliothèques (réglages repris du Rust
# de Mindset).

[graph]
# La suite ne tourne que sous Windows
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Toute faille connue (base RustSec) ou version retirée fait échouer la vérification
ignore = []

[licenses]
# Licences compatibles avec la licence MIT de la suite
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# Nos propres crates (publish = false) : licence MIT, déclarée dans Cargo.toml
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Liste blanche : seules ces bibliothèques peuvent entrer (directes ou indirectes). En ajouter une se fait ici,
# après relecture.
allow = [
    # les nôtres
    "mindcare-moteur",
    # JSON (le catalogue), avec l'ordre des champs du fichier (indexmap)
    "serde_json",
    "serde_core",
    "itoa",
    "memchr",
    "zmij",
    "indexmap",
    "equivalent",
    "hashbrown",
    "foldhash",
    # les accents de la recherche par mots (forme décomposée, comme .NET)
    "unicode-normalization",
    "tinyvec",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []